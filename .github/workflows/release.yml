name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version in strict vMAJOR.MINOR.PATCH form
        required: true
        type: string
      prerelease:
        description: Publish as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Validate Release Request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require main and a strict version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "releases must be dispatched from main, not $GITHUB_REF" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must match vMAJOR.MINOR.PATCH: $RELEASE_VERSION" >&2
            exit 1
          fi

  quality:
    name: Verify
    needs: prepare
    uses: ./.github/workflows/quality.yml

  build:
    name: Build, Verify, and Attest
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and verify the complete release asset set
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: make verify-release VERSION="$RELEASE_VERSION"

      - name: Attest release provenance
        uses: actions/attest-build-provenance@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.1.0
        with:
          subject-path: dist/*

      - name: Upload verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: prepare-commit-msg-${{ inputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Draft Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: prepare-commit-msg-${{ inputs.version }}
          path: dist

      - name: Revalidate downloaded assets
        shell: bash
        run: |
          expected="$(printf '%s\n' \
            SHA256SUMS \
            prepare-commit-msg-darwin-amd64 \
            prepare-commit-msg-darwin-arm64 \
            prepare-commit-msg-linux-amd64 \
            prepare-commit-msg-linux-arm64 \
            prepare-commit-msg-windows-amd64.exe \
            prepare-commit-msg-windows-arm64.exe | LC_ALL=C sort)"
          actual="$(find dist -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "downloaded release asset set mismatch" >&2
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          if grep -qE '[[:space:]]SHA256SUMS$' dist/SHA256SUMS; then
            echo "checksum manifest must not hash itself" >&2
            exit 1
          fi
          if [[ "$(wc -l < dist/SHA256SUMS)" -ne 6 ]]; then
            echo "checksum manifest must contain exactly six entries" >&2
            exit 1
          fi
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Refuse an existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          matching_tag="$(gh api \
            "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_VERSION" \
            --jq ".[] | select(.ref == \"refs/tags/$RELEASE_VERSION\") | .ref")"
          if [[ -n "$matching_tag" ]]; then
            echo "tag already exists: $RELEASE_VERSION" >&2
            exit 1
          fi
          matching_release="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$RELEASE_VERSION\") | .tag_name")"
          if [[ -n "$matching_release" ]]; then
            echo "release already exists: $RELEASE_VERSION" >&2
            exit 1
          fi

      - name: Create and verify draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_VERSION" dist/* \
            --draft \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY" \
            --target "$VALIDATED_SHA" \
            --title "$RELEASE_VERSION"
          release_state="$(gh release view "$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,tagName,targetCommitish \
            --jq '[.isDraft, .tagName, .targetCommitish] | @tsv')"
          if [[ "$release_state" != $'true\t'"$RELEASE_VERSION"$'\t'"$VALIDATED_SHA" ]]; then
            echo "draft release metadata mismatch: $release_state" >&2
            exit 1
          fi
          expected_assets="$(find dist -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)"
          actual_assets="$(gh release view "$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            echo "draft release asset set mismatch" >&2
            exit 1
          fi

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(--draft=false --repo "$GITHUB_REPOSITORY")
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release edit "$RELEASE_VERSION" "${args[@]}"
