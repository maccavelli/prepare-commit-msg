name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

# One run per ref; a new push to the same PR/branch cancels the older run.
# Tag runs are NEVER cancelled: the release job creates a GitHub Release and
# uploads assets.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

# Prefer Node.js 24 LTS for JavaScript-based Actions where supported.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Go quality gate + cross-platform release builds on tag runs
  # ---------------------------------------------------------------------------
  go:
    name: Go (test; build on tag)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            scripts/bootstrap-tools.sh

      - name: Run repository quality contract
        run: make verify

      - name: Build release binaries
        id: build
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          echo "Building release artifacts for tag: $TAG"
          make verify-release VERSION="$TAG"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload release artifacts
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: prepare-commit-msg-${{ steps.build.outputs.version || github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Native test execution across supported operating systems
  # ---------------------------------------------------------------------------
  go-native:
    name: Native Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: macOS
            runner: macos-15
          - name: Windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run native tests
        run: go test ./...

  # ---------------------------------------------------------------------------
  # Publish release assets — tag runs only
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: [go, go-native]
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: maccavelli/mcplib/.github/workflows/publish-selfupdate-release.yml@3e64e3078c875a3dc3ffe235952be9f76c1ac787 # v1.3.0
    with:
      artifact-name: prepare-commit-msg-${{ needs.go.outputs.version || github.sha }}
      products-json: '["prepare-commit-msg"]'
      platforms-json: '[{"os":"linux","arch":"amd64"},{"os":"linux","arch":"arm64"},{"os":"darwin","arch":"amd64"},{"os":"darwin","arch":"arm64"},{"os":"windows","arch":"amd64"},{"os":"windows","arch":"arm64"}]'
      extra-assets-json: '[]'
      bridge-release: false
