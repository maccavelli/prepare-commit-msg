name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

# One run per ref; a new push to the same PR/branch cancels the older run.
# Tag runs are NEVER cancelled: the release job creates a GitHub Release and
# uploads assets.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

# Prefer Node.js 24 LTS for JavaScript-based Actions where supported.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Go quality gate
  # ---------------------------------------------------------------------------
  go:
    name: Go (quality contract)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            scripts/bootstrap-tools.sh

      - name: Run repository quality contract
        run: make verify

  # ---------------------------------------------------------------------------
  # Native test execution across supported operating systems
  # ---------------------------------------------------------------------------
  go-native:
    name: Native Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: macOS
            runner: macos-15
          - name: Windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run native tests
        run: go test ./...

  # ---------------------------------------------------------------------------
  # Build, check and stage the release from selfupdate-release.json. On a tag
  # it builds the release; on any other ref it rehearses it, stamped
  # rehearsal-<commit>, and the release job is skipped.
  # ---------------------------------------------------------------------------
  build:
    name: Build release
    needs: [go, go-native]
    permissions:
      contents: read
    # Both workflows are pinned to the commit of go-selfupdate-lib v1.13.0,
    # the version go.mod requires. The publish path (the publish workflow
    # file and the scripts it runs) is unchanged from v1.11.0's, which has
    # published live, so 0010-MADR D2's rule, as amended, holds
    # (docs/decisions/0012-MADR-adopt-go-1-27-2-go-selfupdate-lib-v1-13-0-and-its-release-pipeline.md
    # B1, P1; docs/decisions/0010-MADR-adopt-go-selfupdate-lib-v1-9-0.md D2).
    uses: maccavelli/go-selfupdate-lib/.github/workflows/build-selfupdate-release.yml@5e199c831b5691ea687943e3c3fd495d50c739ed # v1.13.0
    with:
      spec-path: selfupdate-release.json

  # ---------------------------------------------------------------------------
  # Publish the staged release — tag runs only
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: build
    if: needs.build.outputs.rehearsal == 'false'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: maccavelli/go-selfupdate-lib/.github/workflows/publish-selfupdate-release.yml@5e199c831b5691ea687943e3c3fd495d50c739ed # v1.13.0
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      products-json: ${{ needs.build.outputs.products-json }}
      platforms-json: ${{ needs.build.outputs.platforms-json }}
      extra-assets-json: ${{ needs.build.outputs.extra-assets-json }}
      prerelease-channels-json: ${{ needs.build.outputs.prerelease-channels-json }}
